# main에 올리거나 PR을 열 때마다 단위 테스트와 크롬 확장 폴더 일치 검사를 돌린다.
# (릴리스용 release.yml은 태그를 올릴 때만 돈다 — 그 사이에 main이 깨져도 알 수 있게)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check extension folder is up to date
        run: npm run check:ext

      - name: Unit tests
        run: npm test
